<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteTaker - Your Personal Note Manager</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .main-content {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            flex: 1;
            min-width: 0;
        }

        .sidebar {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            height: fit-content;
            min-width: 0;
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
        }

        .note-editor {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            min-width: 0;
            width: 100%;
            max-width: 920px;
            margin: 0 auto;
        }

        .search-box {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            transition: border-color 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .new-note-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .new-note-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .notes-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .note-item {
            padding: 15px;
            border: 2px solid transparent;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9fa;
            min-width: 0;
            overflow: hidden;
        }

        .note-item:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }

        .note-item.active {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
        }

        .note-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 5px;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .note-preview {
            font-size: 14px;
            color: #666;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            overflow-wrap: anywhere;
        }

        .note-date {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            min-width: 0;
            gap: 12px;
        }

        .back-to-notes-btn {
            border: 0;
            border-radius: 8px;
            padding: 8px 10px;
            color: #4957c6;
            background: #eef1ff;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
        }

        .back-to-notes-btn:hover {
            background: #e1e6ff;
        }

        .back-to-notes-btn:focus-visible {
            outline: 3px solid rgba(73, 87, 198, 0.35);
            outline-offset: 2px;
        }

        .editor-title {
            font-size: 1.5rem;
            color: #333;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .editor-actions {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-save {
            background: #28a745;
            color: white;
        }

        .btn-save:hover {
            background: #218838;
            transform: translateY(-1px);
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
            transform: translateY(-1px);
        }

        .btn-translate {
            background: #4957c6;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-translate:hover {
            background: #3e4bb0;
            transform: translateY(-1px);
        }

        .btn:disabled,
        .form-input:disabled,
        .form-textarea:disabled,
        .search-box:disabled,
        .translation-select:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-label-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
        }

        .character-count {
            color: #777;
            font-size: 12px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-textarea {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s ease;
            line-height: 1.6;
        }

        .form-textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .translation-panel {
            display: flex;
            align-items: end;
            gap: 12px;
            padding-top: 4px;
        }

        .translation-select-group {
            flex: 1;
        }

        .translation-select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            background: white;
            color: #333;
            font: inherit;
        }

        .translation-select:focus {
            outline: none;
            border-color: #667eea;
        }

        .spinner {
            display: none;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.45);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }

        .btn-translate.is-loading .spinner {
            display: inline-block;
        }

        .translation-pending .note-item {
            cursor: wait;
            pointer-events: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 1rem;
            opacity: 0.8;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 15px;
            }
            
            .sidebar, .note-editor {
                padding: 20px;
            }

            .editor-header {
                flex-wrap: wrap;
                align-items: flex-start;
            }

            .editor-title {
                order: 3;
                flex-basis: 100%;
            }

            .translation-panel {
                align-items: stretch;
                flex-direction: column;
            }
        }

        /* Custom Scrollbar */
        .notes-list::-webkit-scrollbar {
            width: 6px;
        }

        .notes-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        .notes-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 3px;
        }

        .notes-list::-webkit-scrollbar-thumb:hover {
            background: #5a6fd8;
        }
    </style>
</head>
<body>
    <div class="container">
            <div class="header">
                <h1>📝 NoteTaker</h1>
            </div>

        <div class="main-content">
            <div class="sidebar">
                <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search notes...">
                <button class="new-note-btn" id="newNoteBtn">✨ New Note</button>
                
                <div class="notes-list" id="notesList">
                    <div class="loading">Loading notes...</div>
                </div>
            </div>

            <div class="note-editor">
                <div class="editor-header">
                    <button class="back-to-notes-btn" id="backToNotesBtn" type="button">← Back to notes</button>
                    <h2 class="editor-title" id="editorTitle">Select a note to edit</h2>
                    <div class="editor-actions" id="editorActions" style="display: none;">
                        <button class="btn btn-save" id="saveBtn">💾 Save</button>
                        <button class="btn btn-delete" id="deleteBtn">🗑️ Delete</button>
                    </div>
                </div>

                <div id="messageArea"></div>

                <div id="editorForm" style="display: none;">
                    <div class="form-group">
                        <div class="form-label-row">
                            <label class="form-label" for="noteTitle">Title</label>
                            <span class="character-count" id="noteTitleCount">0 / 200</span>
                        </div>
                        <input type="text" class="form-input" id="noteTitle" maxlength="200" aria-describedby="noteTitleCount" placeholder="Enter note title...">
                    </div>

                    <div class="form-group">
                        <div class="form-label-row">
                            <label class="form-label" for="noteContent">Content</label>
                            <span class="character-count" id="noteContentCount">0 / 5000</span>
                        </div>
                        <textarea class="form-textarea" id="noteContent" maxlength="5000" aria-describedby="noteContentCount" placeholder="Start writing your note..."></textarea>
                    </div>

                    <div class="translation-panel" aria-live="polite">
                        <div class="translation-select-group">
                            <label class="form-label" for="targetLanguage">Translate into</label>
                            <select class="translation-select" id="targetLanguage">
                                <option value="Simplified Chinese">简体中文</option>
                                <option value="Traditional Chinese">繁體中文</option>
                                <option value="Japanese">日本語</option>
                            </select>
                        </div>
                        <button class="btn btn-translate" id="translateBtn" type="button">
                            <span class="spinner" aria-hidden="true"></span>
                            <span id="translateBtnLabel">Translate note</span>
                        </button>
                    </div>
                </div>

                <div class="empty-state" id="emptyState">
                    <h3>Welcome to NoteTaker!</h3>
                    <p>Select an existing note or create a new one to get started.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const NOTE_LIMITS = { title: 200, content: 5000 };

        function shouldShowDeleteButton(note) {
            return Boolean(note && note.id !== null && note.id !== undefined);
        }

        class NoteTaker {
            constructor() {
                this.notes = [];
                this.currentNote = null;
                this.isLoading = false;
                this.isTranslating = false;
                this.autoSaveTimeout = null;
                this.init();
            }

            async init() {
                this.bindEvents();
                await this.loadNotes();
            }

            bindEvents() {
                document.getElementById('newNoteBtn').addEventListener('click', () => this.createNewNote());
                document.getElementById('backToNotesBtn').addEventListener('click', () => this.returnToNotes());
                document.getElementById('saveBtn').addEventListener('click', () => this.saveNote());
                document.getElementById('deleteBtn').addEventListener('click', () => this.deleteNote());
                document.getElementById('translateBtn').addEventListener('click', () => this.translateCurrentNote());
                document.getElementById('searchBox').addEventListener('input', (e) => this.searchNotes(e.target.value));
                
                // Auto-save on content change (debounced)
                const autoSave = () => {
                    clearTimeout(this.autoSaveTimeout);
                    this.autoSaveTimeout = setTimeout(() => {
                        if (!this.isTranslating && this.currentNote && this.currentNote.id) {
                            this.saveNote(true);
                        }
                    }, 2000);
                };
                
                const handleEditorInput = () => {
                    this.updateCharacterCounters();
                    autoSave();
                };
                document.getElementById('noteTitle').addEventListener('input', handleEditorInput);
                document.getElementById('noteContent').addEventListener('input', handleEditorInput);
            }

            async loadNotes() {
                this.isLoading = true;
                this.showMessage('Loading notes...', 'loading');
                
                try {
                    const response = await fetch('/api/notes');
                    if (!response.ok) throw new Error('Failed to load notes');
                    
                    this.notes = await response.json();
                    this.renderNotesList();
                    this.hideMessage();
                } catch (error) {
                    this.showMessage(`Error loading notes: ${error.message}`, 'error');
                } finally {
                    this.isLoading = false;
                }
            }

            renderNotesList() {
                const notesList = document.getElementById('notesList');
                
                if (this.notes.length === 0) {
                    notesList.innerHTML = '<div class="empty-state"><p>No notes yet. Create your first note!</p></div>';
                    return;
                }

                const filteredNotes = this.getFilteredNotes();
                if (filteredNotes.length === 0) {
                    notesList.innerHTML = '<div class="empty-state"><p>No notes found matching your search.</p></div>';
                    return;
                }

                notesList.innerHTML = filteredNotes.map(note => `
                    <div class="note-item ${this.currentNote && this.currentNote.id === note.id ? 'active' : ''}" 
                         data-note-id="${note.id}" onclick="noteTaker.selectNote(${note.id})">
                        <div class="note-title" title="${this.escapeHtml(note.title || 'Untitled')}">${this.escapeHtml(note.title || 'Untitled')}</div>
                        <div class="note-preview" title="${this.escapeHtml(note.content || 'No content')}">${this.escapeHtml(note.content || 'No content')}</div>
                        <div class="note-date">${this.formatDate(note.updated_at)}</div>
                    </div>
                `).join('');
            }

            async selectNote(noteId) {
                if (this.isTranslating) return;
                const note = this.notes.find(n => n.id === noteId);
                if (!note) return;

                this.currentNote = note;
                this.showEditor();
                this.renderNotesList(); // Re-render to update active state
                
                document.getElementById('noteTitle').value = note.title || '';
                document.getElementById('noteContent').value = note.content || '';
                this.setEditorHeading(note.title || 'Untitled Note');
                this.updateCharacterCounters();
            }

            createNewNote() {
                if (this.isTranslating) return;
                this.currentNote = {
                    id: null,
                    title: '',
                    content: '',
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                };
                
                this.showEditor();
                document.getElementById('noteTitle').value = '';
                document.getElementById('noteContent').value = '';
                this.setEditorHeading('New Note');
                this.updateCharacterCounters();
                document.getElementById('noteTitle').focus();
                
                // Remove active state from all notes
                document.querySelectorAll('.note-item').forEach(item => {
                    item.classList.remove('active');
                });
            }

            showEditor() {
                const sidebar = document.querySelector('.sidebar');
                const editor = document.querySelector('.note-editor');
                sidebar.style.display = 'none';
                editor.style.display = 'flex';
                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('editorForm').style.display = 'block';
                document.getElementById('editorActions').style.display = 'flex';
                this.updateDeleteButtonVisibility();
            }

            updateDeleteButtonVisibility() {
                const deleteButton = document.getElementById('deleteBtn');
                deleteButton.style.display = shouldShowDeleteButton(this.currentNote)
                    ? 'inline-flex'
                    : 'none';
            }

            hideEditor() {
                const sidebar = document.querySelector('.sidebar');
                const editor = document.querySelector('.note-editor');
                sidebar.style.display = 'block';
                editor.style.display = 'none';
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('editorForm').style.display = 'none';
                document.getElementById('editorActions').style.display = 'none';
                this.setEditorHeading('Select a note to edit');
                this.currentNote = null;
            }

            async returnToNotes() {
                if (this.isTranslating || !this.currentNote) return;

                clearTimeout(this.autoSaveTimeout);
                const title = document.getElementById('noteTitle').value.trim();
                const content = document.getElementById('noteContent').value.trim();

                if (title || content) {
                    const didSave = await this.saveNote(true);
                    if (!didSave) return;
                }

                this.hideEditor();
                this.renderNotesList();
            }

            async saveNote(isAutoSave = false) {
                if (!this.currentNote || this.isTranslating) return false;

                const title = document.getElementById('noteTitle').value.trim();
                const content = document.getElementById('noteContent').value.trim();

                if (!title && !content) {
                    if (!isAutoSave) {
                        this.showMessage('Please enter a title or content', 'error');
                    }
                    return false;
                }

                try {
                    const noteData = {
                        title: title || 'Untitled',
                        content: content
                    };

                    let response;
                    if (this.currentNote.id) {
                        // Update existing note
                        response = await fetch(`/api/notes/${this.currentNote.id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(noteData)
                        });
                    } else {
                        // Create new note
                        response = await fetch('/api/notes', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(noteData)
                        });
                    }

                    if (!response.ok) throw new Error('Failed to save note');

                    const savedNote = await response.json();
                    this.currentNote = savedNote;
                    this.updateDeleteButtonVisibility();
                    
                    // Update notes list
                    const existingIndex = this.notes.findIndex(n => n.id === savedNote.id);
                    if (existingIndex >= 0) {
                        this.notes[existingIndex] = savedNote;
                    } else {
                        this.notes.unshift(savedNote);
                    }
                    
                    this.renderNotesList();
                    this.setEditorHeading(savedNote.title);
                    
                    if (!isAutoSave) {
                        this.showMessage('Note saved successfully!', 'success');
                    }
                    return true;
                } catch (error) {
                    this.showMessage(`Error saving note: ${error.message}`, 'error');
                    return false;
                }
            }

            async deleteNote() {
                if (!this.currentNote || !this.currentNote.id || this.isTranslating) return;

                if (!confirm('Are you sure you want to delete this note?')) return;

                try {
                    const response = await fetch(`/api/notes/${this.currentNote.id}`, {
                        method: 'DELETE'
                    });

                    if (!response.ok) throw new Error('Failed to delete note');

                    // Remove from notes array
                    this.notes = this.notes.filter(n => n.id !== this.currentNote.id);
                    this.renderNotesList();
                    this.hideEditor();
                    this.showMessage('Note deleted successfully!', 'success');
                } catch (error) {
                    this.showMessage(`Error deleting note: ${error.message}`, 'error');
                }
            }

            searchNotes(query) {
                if (this.isTranslating) return;
                this.renderNotesList();
            }

            getFilteredNotes() {
                const searchBox = document.getElementById('searchBox');
                const query = searchBox.value.trim().toLowerCase();

                if (query === '') return this.notes;

                return this.notes.filter(note =>
                    (note.title && note.title.toLowerCase().includes(query)) ||
                    (note.content && note.content.toLowerCase().includes(query))
                );
            }

            setTranslationPending(isPending, targetLanguage = '') {
                this.isTranslating = isPending;
                clearTimeout(this.autoSaveTimeout);

                const translateButton = document.getElementById('translateBtn');
                const translateLabel = document.getElementById('translateBtnLabel');
                const controls = [
                    document.getElementById('noteTitle'),
                    document.getElementById('noteContent'),
                    document.getElementById('targetLanguage'),
                    document.getElementById('saveBtn'),
                    document.getElementById('deleteBtn'),
                        document.getElementById('newNoteBtn'),
                        document.getElementById('backToNotesBtn'),
                        document.getElementById('searchBox'),
                    translateButton
                ];

                controls.forEach(control => {
                    control.disabled = isPending;
                });
                translateButton.classList.toggle('is-loading', isPending);
                translateLabel.textContent = isPending
                    ? `Translating to ${targetLanguage}…`
                    : 'Translate note';
                document.body.classList.toggle('translation-pending', isPending);
            }

            async translateCurrentNote() {
                if (!this.currentNote || this.isTranslating) return;

                const title = document.getElementById('noteTitle').value;
                const content = document.getElementById('noteContent').value;
                const targetLanguage = document.getElementById('targetLanguage').value;

                if (!title.trim() && !content.trim()) {
                    this.showMessage('Write a title or content before translating.', 'error');
                    return;
                }

                this.hideMessage();
                this.setTranslationPending(true, targetLanguage);

                try {
                    const response = await fetch('/api/translate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            title,
                            content,
                            target_language: targetLanguage
                        })
                    });
                    const payload = await response.json().catch(() => ({}));

                    if (!response.ok) {
                        throw new Error(payload.error || 'Translation failed. Please try again.');
                    }
                    if (typeof payload.title !== 'string' || typeof payload.content !== 'string') {
                        throw new Error('Translation returned an unexpected result. Please try again.');
                    }

                    document.getElementById('noteTitle').value = payload.title;
                    document.getElementById('noteContent').value = payload.content;
                    this.setEditorHeading(payload.title || 'Untitled Note');
                    this.updateCharacterCounters();
                    this.showMessage('Translation applied. Review it, then click Save to keep it.', 'success');
                } catch (error) {
                    this.showMessage(`Translation error: ${error.message}`, 'error');
                } finally {
                    this.setTranslationPending(false);
                }
            }

            updateCharacterCounters() {
                const title = document.getElementById('noteTitle').value;
                const content = document.getElementById('noteContent').value;
                document.getElementById('noteTitleCount').textContent = `${title.length} / ${NOTE_LIMITS.title}`;
                document.getElementById('noteContentCount').textContent = `${content.length} / ${NOTE_LIMITS.content}`;
            }

            setEditorHeading(title) {
                const editorTitle = document.getElementById('editorTitle');
                editorTitle.textContent = title;
                editorTitle.title = title;
            }

            showMessage(message, type) {
                const messageArea = document.getElementById('messageArea');
                messageArea.innerHTML = `<div class="${type}">${message}</div>`;
                
                if (type === 'success') {
                    setTimeout(() => this.hideMessage(), 3000);
                }
            }

            hideMessage() {
                document.getElementById('messageArea').innerHTML = '';
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            formatDate(dateString) {
                const date = new Date(dateString);
                const now = new Date();
                const diffTime = Math.abs(now - date);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays === 1) {
                    return 'Today';
                } else if (diffDays === 2) {
                    return 'Yesterday';
                } else if (diffDays <= 7) {
                    return `${diffDays - 1} days ago`;
                } else {
                    return date.toLocaleDateString();
                }
            }
        }

        // Initialize the app
        const noteTaker = new NoteTaker();
    </script>
</body>
</html>
